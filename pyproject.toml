[project]
name = "agenticstack"
version = "2.0.0"
description = "Generic agentic stack — LLM orchestration and memory, configurable entirely via API"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",

    # Pydantic
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",

    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.50",

    # LangMem — LLM-powered long-term memory
    "langmem>=0.0.15",

    # LangGraph PostgreSQL checkpoint + pgvector store
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",

    # LLM providers (all installed; selected via LLM_PROVIDER env var or per-app config)
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.3.1",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",

    # Azure identity (used when LLM_PROVIDER=azure)
    "azure-identity>=1.19.0,<2.0.0",

    # Env file loading
    "python-dotenv>=1.0.0,<2.0.0",

    # SQLAlchemy async — registered_apps table
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",

    # HTTP client for webhook dispatch
    "httpx>=0.27.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
