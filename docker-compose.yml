services:
  agenticstack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8848:8000"
    env_file:
      - .env
    environment:
      # Container-internal routing — service names, not localhost
      APP_POSTGRES_HOST: app_postgres
      LANGMEM_POSTGRES_HOST: langmem_postgres
      # Uncomment if using Ollama (also requires: OLLAMA_HOST=0.0.0.0 on the host).
      # LLM_PROVIDER: ollama
      # OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      app_postgres:
        condition: service_healthy
      langmem_postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── App data (registered_apps table, conversation history) ───────────────

  app_postgres:
    image: postgres:16-alpine
    restart: on-failure
    shm_size: "128mb"
    environment:
      POSTGRES_USER: agenticstack
      POSTGRES_DB: agenticstack
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-agenticstacksecret}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "agenticstack", "-U", "agenticstack"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    ports:
      - "8433:5432"

  # ── LangMem memory store (PostgreSQL + pgvector) ─────────────────────────

  langmem_postgres:
    image: ankane/pgvector:v0.5.1
    restart: on-failure
    shm_size: "128mb"
    env_file:
      - .env
    environment:
      POSTGRES_USER: langmem
      POSTGRES_DB: langmem
      POSTGRES_PASSWORD: ${LANGMEM_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "langmem", "-U", "langmem"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - langmem_postgres_data:/var/lib/postgresql/data
    ports:
      - "8432:5432"

volumes:
  app_postgres_data:
    driver: local
  langmem_postgres_data:
    driver: local
